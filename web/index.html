<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Gölge Krallık: Kadim Mühür">
  <meta name="theme-color" content="#080B12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GKK">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GKK Mobile</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #080B12;
      color: #F4E8C1;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #gkk-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, #131A2B 0%, #080B12 72%);
      transition: opacity 220ms ease-out;
      pointer-events: none;
    }

    #gkk-boot-loader.gkk-hide {
      opacity: 0;
    }

    .gkk-ring {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2.5px solid rgba(245, 185, 66, 0.18);
      border-top-color: #F5B942;
      box-shadow: 0 0 24px rgba(245, 185, 66, 0.22);
      animation: gkk-spin 0.9s linear infinite;
    }

    .gkk-title {
      margin-top: 18px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.26em;
      color: #F5B942;
      text-transform: uppercase;
    }

    .gkk-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(226, 232, 240, 0.58);
    }

    @keyframes gkk-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="gkk-boot-loader" aria-hidden="true">
    <div class="gkk-ring"></div>
    <div class="gkk-title">GÖLGE KRALLIK</div>
    <div class="gkk-sub">Mühür uyandırılıyor...</div>
  </div>

  <script>
    (function () {
      var dismissed = false;
      function dismissBootLoader() {
        if (dismissed) return;
        dismissed = true;
        var el = document.getElementById('gkk-boot-loader');
        if (!el) return;
        el.classList.add('gkk-hide');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 250);
      }

      window.addEventListener('flutter-first-frame', dismissBootLoader, { once: true });

      // Fallback: if flutter-view mounts and first-frame event was missed, dismiss shortly after.
      var obs = new MutationObserver(function () {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          obs.disconnect();
          setTimeout(dismissBootLoader, 600);
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });

      // Self-heal stale localhost Service Worker cache if bootstrap ever wedges.
      var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
      if (isLocal && 'serviceWorker' in navigator) {
        setTimeout(function () {
          if (dismissed || document.querySelector('flutter-view, flt-glass-pane')) return;
          if (sessionStorage.getItem('gkk_sw_recovered') === '1') return;
          sessionStorage.setItem('gkk_sw_recovered', '1');
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs || !regs.length) return;
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (window.caches && caches.keys) {
                  return caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .finally(function () { location.reload(); });
          });
        }, 12000);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
