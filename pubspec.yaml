name: gkk_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  dio: ^5.9.2
  supabase_flutter: ^2.12.2
  go_router: ^17.0.0
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  google_fonts: ^6.3.2
  lottie: ^3.3.1
  flutter_svg: ^2.2.3
  motor: ^1.1.0
  shared_preferences: ^2.5.3
  audioplayers: ^6.6.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  flutter_markdown: ^0.7.7+1
  package_info_plus: ^9.0.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Root & Audio SFX
    - assets/
    - assets/audio/

    # Core 2D UI & Game Sprites
    - assets/dungeon/
    - assets/characters/
    - assets/profile/
    - assets/elements/
    - assets/items/
    - assets/items/weapons/
    - assets/items/generated/
    - assets/wheel/
    - assets/chest/
    - assets/ui/
    - assets/ui/character_status_bar/
    - assets/menuitems/

    # 3D GLB Models
    - assets/models/
    - assets/models/characters/
    - assets/models/monsters/
    - assets/models/weapons/
    - assets/models/weapons/textures/
    - assets/models/weapons/textures/DamagedHelmet/
    - assets/models/weapons/textures/sword/
    - assets/models/environment/
    - assets/models/props/
    - assets/models/aion2/
    - assets/models/aion2/textures/

    # Real 2K PBR Textures & Baked Maps
    - assets/textures/
    - assets/textures/pbr_2k/
    - assets/textures/pbr_2k/ground_dirt/
    - assets/textures/pbr_2k/metal_iron/
    - assets/textures/pbr_2k/stone_wall/
    - assets/textures/pbr_2k/wood_planks/
    - assets/textures/baked/
    - assets/textures/baked/sword/

    # Blender Beauty Renders
    - assets/renders/
    - assets/renders/characters/
    - assets/renders/monsters/
    - assets/renders/weapons/
    - assets/renders/environment/
    - assets/renders/props/
    - assets/renders/aion2/

    # Image Assets Root & Production Aion-2 UI System
    - assets/images/
    - assets/images/aion2_ui/

    # Aion-2 Dark Fantasy Portraits
    - assets/images/portraits/
    - assets/images/portraits/elyos/
    - assets/images/portraits/asmodian/
    - assets/images/portraits/bosses/
    - assets/images/portraits/npcs/

    # High-Detail Fantasy Skill & Equipment Icons
    - assets/images/icons/
    - assets/images/icons/skills_elemental/
    - assets/images/icons/skills_physical/
    - assets/images/icons/weapons/
    - assets/images/icons/armor/

    # Atmospheric Living Backgrounds
    - assets/images/backgrounds/
    - assets/images/backgrounds/elysea/
    - assets/images/backgrounds/asmodae/
    - assets/images/backgrounds/dungeons/

    # VFX Sprites, Runic Circles & Atlases
    - assets/images/vfx_sprites/
    - assets/images/vfx_sprites/magic_circles/
    - assets/images/vfx_sprites/flipbooks/

  shaders:
    # Postprocess Passes
    - shaders/postprocess/aces_tonemap.frag
    - shaders/postprocess/ssao.frag
    - shaders/postprocess/ssao_bilateral_blur.frag
    - shaders/postprocess/ssao_composite_aces.frag

    # Lighting & Clustered Shading
    - shaders/lighting/dungeon_lighting.frag
    - shaders/lighting/clustered_crowd_lighting.frag

    # PBR Master Materials
    - shaders/materials/aion2_pbr_master.frag

    # Combat & Environmental VFX
    - shaders/vfx/forge_fire.frag
    - shaders/vfx/gpu_particles.frag
    - shaders/vfx/ground_decal.frag
    - shaders/vfx/ribbon_trail.frag
    - shaders/vfx/rim_hit_flash.frag
    - shaders/vfx/shockwave_refraction.frag

    # World & Environmental Surface Simulation
    - shaders/world/atmospheric_sky.frag
    - shaders/world/puddle_ssr.frag

    # Crowd Rendering & VAT Deformation
    - shaders/crowd/vat_crowd.frag
    - shaders/crowd/vat_crowd.vert
    - shaders/crowd/gpu_instancing.vert

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
